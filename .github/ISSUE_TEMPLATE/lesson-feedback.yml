name: 🙋 Застрял на уроке
description: Шаги или проверка урока не сработали, или что-то осталось непонятным
labels: ["lesson-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Напишите, где урок вас потерял. По-русски, своими словами.

        Если проблема в самом Claude Code, а не в уроке, всё равно пишите сюда — разберёмся.
  - type: input
    id: lesson
    attributes:
      label: Урок
      description: Номер урока, например b-2. Ссылка «Застряли на уроке?» подставляет его сама.
      placeholder: "b-2"
    validations:
      required: true
  - type: dropdown
    id: slot
    attributes:
      label: Где не получилось
      options:
        - Что понадобится (подготовка)
        - Идея
        - Разбор на примере
        - Ваша очередь
        - Проверка
        - Другое
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: На каком шаге вы были, что сделали, чего ждали и что увидели. Если запускали `npm run check`, вставьте его вывод.
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Версия Claude Code
      description: Вывод команды `claude --version`.
      placeholder: "2.1.285 (Claude Code)"
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Где практиковались
      options:
        - macOS
        - Linux
        - WSL2
        - Windows (без WSL)
        - Codespaces
    validations:
      required: false
